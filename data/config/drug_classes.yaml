# Drug-class definitions (data_cleaning_plan.md Section 6.1).
#
# agent_classes: every MSK-CHORD AGENT maps to exactly one class. exposure.py
#   raises on any agent not listed here, so new data cannot be silently
#   mis-classified (checklist item 1). `non_systemic` agents (bone agents,
#   topicals, ophthalmics, liver-directed Y-90, intravesical BCG) are ignored
#   for prior / intervening lines. `other_<subtype>` lists hold the remaining
#   agents grouped by their MSK-CHORD SUBTYPE.
# cohorts: anchor_classes define time zero. companions are agents given with
#   the anchor; they count as an intervening line only when started outside
#   every class episode. later_line_flags are
#   recorded as exposure before collection (prostate AR inhibitors, etc.).
#   subclass entries are "class" or "class:AGENT"; the first subclass whose
#   agents start within 30 days of class_start wins, in the order listed.
cohorts:
  breast:
    label: Breast / endocrine
    cancer_type: Breast Cancer
    icd_o_sites:
    - C50
    anchor_classes:
    - aromatase_inhibitor
    - serm
    - serd
    subclass:
      AI:
      - aromatase_inhibitor
      tamoxifen:
      - serm
      fulvestrant:
      - serd
    companions:
      companion_cdk46:
        classes:
        - cdk46_inhibitor
        agents: []
      ovarian_suppression:
        classes: []
        agents:
        - LEUPROLIDE
        - GOSERELIN
        - TRIPTORELIN
    later_line_flags:
      cdk46_any:
        classes:
        - cdk46_inhibitor
        agents: []
      pi3k_mtor:
        classes:
        - pi3k_mtor
        agents: []
  nsclc:
    label: NSCLC / EGFR-TKI
    cancer_type: Non-Small Cell Lung Cancer
    icd_o_sites:
    - C34
    anchor_classes:
    - egfr_tki_1g2g
    - egfr_tki_3g
    subclass:
      osimertinib:
      - egfr_tki_3g
      1st/2nd-gen TKI:
      - egfr_tki_1g2g
    companions: {}
    later_line_flags: {}
  prostate:
    label: Prostate / ADT
    cancer_type: Prostate Cancer
    icd_o_sites:
    - C61
    anchor_classes:
    - gnrh
    - antiandrogen_1g
    subclass:
      GnRH:
      - gnrh
      antiandrogen:
      - antiandrogen_1g
    companions: {}
    later_line_flags:
      ar_inhibitor_exposure:
        classes:
        - ar_inhibitor
        agents: []
  crc:
    label: CRC / FOLFOX-CAPOX
    cancer_type: Colorectal Cancer
    icd_o_sites:
    - C18
    - C19
    - C20
    anchor_classes:
    - oxaliplatin
    subclass:
      FOLFOX:
      - fluoropyrimidine:FLUOROURACIL
      CAPOX:
      - fluoropyrimidine:CAPECITABINE
    companions:
      fluoropyrimidine_backbone:
        classes: []
        agents:
        - FLUOROURACIL
        - CAPECITABINE
        - LEUCOVORIN
    later_line_flags:
      irinotecan:
        classes:
        - irinotecan
        agents: []
      anti_egfr_mab:
        classes:
        - anti_egfr_mab
        agents: []
      anti_vegf:
        classes:
        - anti_vegf
        agents: []
